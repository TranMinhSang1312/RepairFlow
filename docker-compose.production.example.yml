name: repairflow-production

services:
  api:
    build:
      context: .
      dockerfile: docker/production.Dockerfile
      target: api
    env_file: ${REPAIRFLOW_ENV_FILE:-.env.production}
    command: ["sh", "-c", "pnpm exec prisma migrate deploy && node apps/api/dist/main.js"]
    restart: unless-stopped
    expose: ["3001"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    build:
      context: .
      dockerfile: docker/production.Dockerfile
      target: worker
    env_file: ${REPAIRFLOW_ENV_FILE:-.env.production}
    restart: unless-stopped
    expose: ["3002"]
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/production.Dockerfile
      target: web
      args:
        NEXT_PUBLIC_OBJECT_STORAGE_ORIGIN: ${NEXT_PUBLIC_OBJECT_STORAGE_ORIGIN:-http://localhost:9000}
    env_file: ${REPAIRFLOW_ENV_FILE:-.env.production}
    restart: unless-stopped
    ports: ["3000:3000"]
    depends_on:
      api:
        condition: service_healthy

# PostgreSQL and private object storage are intentionally external in production.
# Configure DATABASE_URL and OBJECT_STORAGE_* to managed services with PITR,
# object versioning, encryption, and least-privilege credentials.
