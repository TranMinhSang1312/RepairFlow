name: repairflow

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: repairflow
      POSTGRES_USER: repairflow
      POSTGRES_PASSWORD: repairflow
    ports:
      - "5432:5432"
    volumes:
      - repairflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repairflow -d repairflow"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-repairflow}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-local-development-only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - repairflow-minio:/data
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-repairflow}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-local-development-only}
      MINIO_BUCKET: ${OBJECT_STORAGE_BUCKET:-repairflow-private}
    entrypoint: >-
      /bin/sh -c '
      until /usr/bin/mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done;
      /usr/bin/mc mb --ignore-existing "local/$${MINIO_BUCKET}";
      /usr/bin/mc anonymous set none "local/$${MINIO_BUCKET}";
      '
    restart: "no"

volumes:
  repairflow-postgres:
  repairflow-minio:
