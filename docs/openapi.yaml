        quoteItemId: {type: [string, 'null'], format: uuid, description: Required for REPAIR/TEST; forbidden for operational notes and derived for corrections.}
        supersedesId: {type: [string, 'null'], format: uuid, description: Required only for CORRECTION and must name the effective leaf.}
    WorkLog:
      type: object
      additionalProperties: false
      required: [id, repairOrderId, quoteItemId, scopeKey, type, effectiveType, content, supersedesId, isEffective, createdByUserId, createdAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        repairOrderId: {$ref: '#/components/schemas/Uuid'}
        quoteItemId: {type: [string, 'null'], format: uuid}
        scopeKey: {type: [string, 'null'], format: uuid}
        type: {type: string, enum: [REPAIR, TEST, CUSTOMER_CONTACT, INTERNAL_NOTE, CORRECTION]}
        effectiveType: {type: string, enum: [REPAIR, TEST, CUSTOMER_CONTACT, INTERNAL_NOTE]}
        content: {type: string}
        supersedesId: {type: [string, 'null'], format: uuid}
        isEffective: {type: boolean}
        createdByUserId: {$ref: '#/components/schemas/Uuid'}
        createdAt: {$ref: '#/components/schemas/IsoDateTime'}
    WorkLogResponse: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/WorkLog'}}}

    CreatePartRequirementRequest:
      type: object
      additionalProperties: false
      required: [quoteItemId]
      properties:
        quoteItemId: {$ref: '#/components/schemas/Uuid'}
        sku: {type: [string, 'null'], maxLength: 100}
    UpdatePartRequirementRequest:
      type: object
      additionalProperties: false
      required: [targetStatus, expectedLockVersion]
      properties:
        targetStatus: {type: string, enum: [ORDERED, AVAILABLE], description: CANCELLED is deliberately absent because it is system-only.}
        expectedLockVersion: {type: integer, minimum: 0}
    PartRequirement:
      type: object
      additionalProperties: false
      required: [id, repairOrderId, quoteItemId, scopeKey, nameSnapshot, sku, quantity, quantityUnit, status, lockVersion, createdByUserId, updatedByUserId, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        repairOrderId: {$ref: '#/components/schemas/Uuid'}
        quoteItemId: {$ref: '#/components/schemas/Uuid'}
        scopeKey: {$ref: '#/components/schemas/Uuid'}
        nameSnapshot: {type: string}
        sku: {type: [string, 'null']}
        quantity: {type: number, exclusiveMinimum: 0, multipleOf: 0.01}
        quantityUnit: {type: string, enum: [EACH, HOUR]}
        status: {type: string, enum: [NEEDED, ORDERED, AVAILABLE, CANCELLED]}
        lockVersion: {type: integer, minimum: 0}
        createdByUserId: {$ref: '#/components/schemas/Uuid'}
        updatedByUserId: {$ref: '#/components/schemas/Uuid'}
        createdAt: {$ref: '#/components/schemas/IsoDateTime'}
        updatedAt: {$ref: '#/components/schemas/IsoDateTime'}
    PartRequirementResponse: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/PartRequirement'}}}

    CreatePartUsedRequest:
      type: object
      additionalProperties: false
      required: [quoteItemId, name, quantity]
      properties:
        quoteItemId: {$ref: '#/components/schemas/Uuid'}
        name: {type: string, minLength: 1, maxLength: 300}
        sku: {type: [string, 'null'], maxLength: 100}
        quantity: {type: number, exclusiveMinimum: 0, multipleOf: 0.01}
        unitCost: {oneOf: [{$ref: '#/components/schemas/MoneyVnd'}, {type: 'null'}]}
        unitSalePrice: {oneOf: [{$ref: '#/components/schemas/MoneyVnd'}, {type: 'null'}]}
        supersedesId: {type: [string, 'null'], format: uuid}
    PartUsed:
      type: object
      additionalProperties: false
      required: [id, repairOrderId, quoteItemId, scopeKey, supersedesId, name, sku, quantity, unitCost, unitSalePrice, isEffective, createdByUserId, createdAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        repairOrderId: {$ref: '#/components/schemas/Uuid'}
        quoteItemId: {$ref: '#/components/schemas/Uuid'}
        scopeKey: {$ref: '#/components/schemas/Uuid'}
        supersedesId: {type: [string, 'null'], format: uuid}
        name: {type: string}
        sku: {type: [string, 'null']}
        quantity: {type: number, exclusiveMinimum: 0, multipleOf: 0.01}
        unitCost: {oneOf: [{$ref: '#/components/schemas/MoneyVnd'}, {type: 'null'}]}
        unitSalePrice: {oneOf: [{$ref: '#/components/schemas/MoneyVnd'}, {type: 'null'}]}
        isEffective: {type: boolean}
        createdByUserId: {$ref: '#/components/schemas/Uuid'}
        createdAt: {$ref: '#/components/schemas/IsoDateTime'}
    PartUsedResponse: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/PartUsed'}}}

    CreateQcTemplateRequest:
      type: object
      additionalProperties: false
      required: [name, items]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [label, isRequired, allowNa, sortOrder]
            properties:
              label: {type: string, minLength: 1, maxLength: 500}
              isRequired: {type: boolean}
              allowNa: {type: boolean}
              sortOrder: {type: integer, minimum: 1}
    QcTemplateItem:
      type: object
      additionalProperties: false
      required: [id, label, isRequired, allowNa, sortOrder]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        label: {type: string}
        isRequired: {type: boolean}
        allowNa: {type: boolean}
        sortOrder: {type: integer, minimum: 1}
    QcTemplate:
      type: object
      additionalProperties: false
      required: [id, name, versionNo, isActive, items, createdAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        versionNo: {type: integer, minimum: 1}
        isActive: {type: boolean}
        items: {type: array, items: {$ref: '#/components/schemas/QcTemplateItem'}}
        createdAt: {$ref: '#/components/schemas/IsoDateTime'}
    QcTemplateResponse: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/QcTemplate'}}}
    QcTemplateListResponse: {type: object, required: [data], properties: {data: {type: array, items: {$ref: '#/components/schemas/QcTemplate'}}}}

    CreateQcRunRequest:
      type: object
      additionalProperties: false
      required: [qcTemplateId, expectedLockVersion, results]
      properties:
        qcTemplateId: {$ref: '#/components/schemas/Uuid'}
        expectedLockVersion: {type: integer, minimum: 0}
        notes: {type: [string, 'null'], maxLength: 5000}
        results:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required: [qcTemplateItemId, result, evidenceMediaAssetIds]
            properties:
              qcTemplateItemId: {$ref: '#/components/schemas/Uuid'}
              result: {type: string, enum: [PASS, FAIL, NOT_APPLICABLE]}
              note: {type: [string, 'null'], maxLength: 1000}
              evidenceMediaAssetIds: {type: array, maxItems: 10, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
    QcResult:
      type: object
      additionalProperties: false
      required: [id, qcTemplateItemId, labelSnapshot, result, note, evidenceMediaAssetIds]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        qcTemplateItemId: {$ref: '#/components/schemas/Uuid'}
        labelSnapshot: {type: string}
        result: {type: string, enum: [PASS, FAIL, NOT_APPLICABLE]}
        note: {type: [string, 'null']}
        evidenceMediaAssetIds: {type: array, items: {$ref: '#/components/schemas/Uuid'}}
    QcRun:
      type: object
      additionalProperties: false
      required: [id, repairOrderId, qcTemplateId, templateName, templateVersionNo, runNo, result, notes, results, checkedByUserId, createdAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        repairOrderId: {$ref: '#/components/schemas/Uuid'}
        qcTemplateId: {$ref: '#/components/schemas/Uuid'}
        templateName: {type: string}
        templateVersionNo: {type: integer, minimum: 1}
        runNo: {type: integer, minimum: 1}
        result: {type: string, enum: [PASS, FAIL]}
        notes: {type: [string, 'null']}
        results: {type: array, items: {$ref: '#/components/schemas/QcResult'}}
        checkedByUserId: {$ref: '#/components/schemas/Uuid'}
        createdAt: {$ref: '#/components/schemas/IsoDateTime'}
    QcRunResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [run, orderStatus, orderLockVersion]
          properties:
            run: {$ref: '#/components/schemas/QcRun'}
            orderStatus: {$ref: '#/components/schemas/RepairOrderStatus'}
            orderLockVersion: {type: integer, minimum: 0}

    CreatePaymentRequest:
      type: object
      additionalProperties: false
      required: [amount, method]
      properties:
        amount: {type: integer, format: int64, minimum: 1}
        method: {type: string, enum: [CASH, BANK_TRANSFER, CARD, E_WALLET, OTHER]}
        reference: {type: [string, 'null'], maxLength: 200}
    Payment:
      type: object
      additionalProperties: false
      required: [id, amount, method, reference, receivedByUserId, receivedAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        amount: {type: integer, format: int64, minimum: 1}
        method: {type: string, enum: [CASH, BANK_TRANSFER, CARD, E_WALLET, OTHER]}
        reference: {type: [string, 'null']}
        receivedByUserId: {$ref: '#/components/schemas/Uuid'}
        receivedAt: {$ref: '#/components/schemas/IsoDateTime'}
    PaymentSummary:
      type: object
      additionalProperties: false
      required: [approvedTotal, paidTotal, amountDue]
      properties:
        approvedTotal: {$ref: '#/components/schemas/MoneyVnd'}
        paidTotal: {$ref: '#/components/schemas/MoneyVnd'}
        amountDue: {$ref: '#/components/schemas/MoneyVnd'}
    PaymentResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [payment, summary]
          properties:
            payment: {$ref: '#/components/schemas/Payment'}
            summary: {$ref: '#/components/schemas/PaymentSummary'}

    CompleteHandoverRequest:
      type: object
      additionalProperties: false
      required: [recipientName, paymentDisposition, expectedLockVersion]
      properties:
        recipientName: {type: string, minLength: 1, maxLength: 150}
        paymentDisposition: {type: string, enum: [PAID, PARTIALLY_PAID, WAIVED, PAY_LATER]}
        paymentNote: {type: [string, 'null'], maxLength: 1000}
        signatureMediaAssetId: {type: [string, 'null'], format: uuid}
        expectedLockVersion: {type: integer, minimum: 0}
        payment:
          oneOf:
            - {$ref: '#/components/schemas/CreatePaymentRequest'}
            - {type: 'null'}
        warranty:
          type: [object, 'null']
          additionalProperties: false
          required: [endsAt, terms]
          properties:
            endsAt: {$ref: '#/components/schemas/IsoDateTime'}
            terms: {type: string, minLength: 1, maxLength: 10000}
    Handover:
      type: object
      additionalProperties: false
      required: [id, recipientName, paymentDisposition, paymentNote, handedOverByUserId, handedOverAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        recipientName: {type: string}
        paymentDisposition: {type: string, enum: [PAID, PARTIALLY_PAID, WAIVED, PAY_LATER]}
        paymentNote: {type: [string, 'null']}
        handedOverByUserId: {$ref: '#/components/schemas/Uuid'}
        handedOverAt: {$ref: '#/components/schemas/IsoDateTime'}
    Warranty:
      type: object
      additionalProperties: false
      required: [id, startsAt, endsAt, terms]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        startsAt: {$ref: '#/components/schemas/IsoDateTime'}
        endsAt: {$ref: '#/components/schemas/IsoDateTime'}
        terms: {type: string}
    HandoverResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [order, handover, payment, warranty, paymentSummary, trackingUrl, trackingExpiresAt]
          properties:
            order: {$ref: '#/components/schemas/RepairOrder'}
            handover: {$ref: '#/components/schemas/Handover'}
            payment: {oneOf: [{$ref: '#/components/schemas/Payment'}, {type: 'null'}]}
            warranty: {oneOf: [{$ref: '#/components/schemas/Warranty'}, {type: 'null'}]}
            paymentSummary: {$ref: '#/components/schemas/PaymentSummary'}
            trackingUrl: {type: string, format: uri, description: Derived only for this response and never persisted.}
            trackingExpiresAt: {$ref: '#/components/schemas/IsoDateTime'}

    CreateWarrantyOrderRequest:
      type: object
      additionalProperties: false
      required: [eligibilityConfirmed, branchId, priority, reportedProblem, intakeCondition, consentAccepted, accessories, intakeMediaAssetIds]
      properties:
        eligibilityConfirmed: {type: boolean, const: true}
        branchId: {$ref: '#/components/schemas/Uuid'}
        priority: {type: string, enum: [LOW, NORMAL, HIGH, URGENT], default: NORMAL}
        reportedProblem: {type: string, minLength: 1, maxLength: 5000}
        intakeCondition: {type: string, minLength: 1, maxLength: 5000}
        consentAccepted: {type: boolean, const: true}
        promisedAt: {type: [string, 'null'], format: date-time}
        accessories:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name: {type: string, minLength: 1, maxLength: 200}
              conditionNote: {type: [string, 'null'], maxLength: 1000}
        intakeMediaAssetIds: {type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
    LinkedOrderSummary:
      type: object
      additionalProperties: false
      required: [code, serviceType, status, completionOutcome, receivedAt, readyAt, returnedAt]
      properties:
        code: {type: string}
        serviceType: {type: string, enum: [STANDARD, WARRANTY]}
        status: {$ref: '#/components/schemas/RepairOrderStatus'}
        completionOutcome: {oneOf: [{$ref: '#/components/schemas/CompletionOutcome'}, {type: 'null'}]}
        receivedAt: {$ref: '#/components/schemas/IsoDateTime'}
        readyAt: {type: [string, 'null'], format: date-time}
        returnedAt: {type: [string, 'null'], format: date-time}
    PublicQuoteItem:
      type: object
      additionalProperties: false
      required: [id, kind, description, displayNote, quantity, quantityUnit, unitPrice, lineTotal, isOptional, approvalGroup]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        kind: {type: string, enum: [SERVICE, PART, FEE]}
        description: {type: string}
        displayNote: {type: [string, 'null']}
        quantity: {type: number, exclusiveMinimum: 0, multipleOf: 0.01}
        quantityUnit: {type: string, enum: [EACH, HOUR]}
        unitPrice: {$ref: '#/components/schemas/MoneyVnd'}
        lineTotal: {$ref: '#/components/schemas/MoneyVnd'}
        isOptional: {type: boolean}
        approvalGroup:
          type: [string, 'null']
          description: Optional items sharing a non-null group are selected all-or-none.
    PublicQuote:
      type: object
      additionalProperties: false
      required: [id, versionNo, status, currency, items, subtotal, discount, total, customerNote, expiresAt, sentAt, decidedAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        versionNo: {type: integer, minimum: 1}
        status: {type: string, enum: [SENT, ACCEPTED, PARTIALLY_ACCEPTED, DECLINED]}
        currency: {type: string, const: VND}
        items:
          type: array
          items: {$ref: '#/components/schemas/PublicQuoteItem'}
        subtotal: {$ref: '#/components/schemas/MoneyVnd'}
        discount: {$ref: '#/components/schemas/MoneyVnd'}
        total: {$ref: '#/components/schemas/MoneyVnd'}
        customerNote: {type: [string, 'null']}
        expiresAt: {$ref: '#/components/schemas/IsoDateTime'}
        sentAt: {$ref: '#/components/schemas/IsoDateTime'}
        decidedAt: {type: [string, 'null'], format: date-time}
    PublicOrderResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [shopName, shopContact, orderCode, deviceLabel, status, completionOutcome, readyAt, returnedAt, timeline, quote, warranty, linkedOrders]
          properties:
            shopName: {type: string}
            shopContact: {type: [string, 'null']}
            orderCode: {type: string}
            deviceLabel: {type: string}
            status: {$ref: '#/components/schemas/RepairOrderStatus'}
            completionOutcome:
              oneOf:
                - {$ref: '#/components/schemas/CompletionOutcome'}
                - {type: 'null'}
            readyAt: {type: [string, 'null'], format: date-time}
            returnedAt: {type: [string, 'null'], format: date-time}
            timeline:
              type: array
              items:
                type: object
                required: [type, message, createdAt]
                properties:
                  type: {type: string}
                  message: {type: string}
                  createdAt: {$ref: '#/components/schemas/IsoDateTime'}
            quote:
              oneOf:
                - {$ref: '#/components/schemas/PublicQuote'}
                - {type: 'null'}
            warranty:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [startsAt, endsAt, terms, status]
                  properties:
                    startsAt: {$ref: '#/components/schemas/IsoDateTime'}
                    endsAt: {$ref: '#/components/schemas/IsoDateTime'}
                    terms: {type: string}
                    status: {type: string, enum: [ACTIVE, EXPIRED]}
                - {type: 'null'}
            linkedOrders:
              type: array
              description: Safe child/source progress without internal UUIDs.
              items: {$ref: '#/components/schemas/LinkedOrderSummary'}
    AiRunResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, capability, status, promptVersion, createdAt]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            capability: {type: string, enum: [DEVICE_OCR, INTAKE_DRAFT, CHECKLIST_SUGGESTION, CUSTOMER_SUMMARY]}
            status: {type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, REJECTED]}
            promptVersion: {type: string}
            output: {type: [object, 'null']}
            confidence: {type: [number, 'null'], minimum: 0, maximum: 1}
            errorCode: {type: [string, 'null']}
            createdAt: {$ref: '#/components/schemas/IsoDateTime'}

security:
  - bearerAuth: []
