        approvedTotal: {$ref: '#/components/schemas/MoneyVnd'}
        decidedAt: {$ref: '#/components/schemas/IsoDateTime'}
        items: {type: array, items: {$ref: '#/components/schemas/ApprovedScopeItem'}}

    CreateWorkLogRequest:
      type: object
